<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Mis tareas</h1>

    <form id="task-form" class="task-form" autocomplete="off">
      <label for="task-input" class="visually-hidden">Nueva tarea</label>
      <input type="text" id="task-input" placeholder="¿Qué tienes que hacer?" maxlength="200" required>
      <button type="submit">Añadir</button>
    </form>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <p id="empty-msg" class="empty-msg">No hay tareas todavía.</p>

    <footer class="task-footer">
      <span id="counter"></span>
      <button type="button" id="clear-done">Borrar completadas</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
